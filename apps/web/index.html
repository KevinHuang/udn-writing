<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>聯合報雲寫作教室</title>

    <!--
      兩套字形（聯合學苑的視覺，2026-09-19）：
        介面  思源黑體 Noto Sans TC（400／500／700）—— 按鈕、標題、表格、數字
        作文  霞鶩文楷 LXGW WenKai TC（400／700）—— 學生作文與題目內文（font-essay）

      Google Fonts 會把繁中切成上百個 unicode-range 片段、依字頻排序，
      瀏覽器只抓頁面實際用到的那幾片，所以兩套都走 CDN 而不是自架整包。
      preconnect 讓字體檔的連線提前建立。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
